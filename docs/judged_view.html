<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What each labeller said, line by line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=Noto+Naskh+Arabic:wght@500&display=swap">
<style>
:root { --bg:#f5f7fa; --surface:#fff; --fg:#151b23; --muted:#586374; --line:#d3d9e2; --accent:#1464c8; --good:#1c7448; --bad:#b3261e; --warn:#9a5b00;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif; --arabic:"Noto Naskh Arabic","Amiri",serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#0e1217; --surface:#161b22; --fg:#e5e9ef; --muted:#98a3b3; --line:#2a323e; --accent:#6aa9f0; --good:#62cf9b; --bad:#f28b82; --warn:#e0a84a; color-scheme:dark; } }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 var(--body); display:flex; flex-direction:column; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
h1 { font:600 17px var(--display); margin:0; }
.grow { flex:1; }
button, select { font:500 13px var(--body); color:var(--fg); background:var(--surface); border:1.5px solid var(--line); border-radius:5px; padding:5px 11px; cursor:pointer; }
button:hover { border-color:var(--muted); } button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button[aria-pressed=true] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.meta { color:var(--muted); font-size:13px; }
.score { font-variant-numeric:tabular-nums; }
.score b { color:var(--fg); }
main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr); }
.left { overflow:auto; padding:12px; border-right:1px solid var(--line); }
.sheet { position:relative; width:100%; max-width:980px; margin:0 auto; background:#fff; border:1px solid var(--line); }
.sheet img { display:block; width:100%; height:auto; }
.box { position:absolute; border:2px solid; border-radius:2px; cursor:pointer; background:color-mix(in srgb, currentColor 13%, transparent); }
.box.start { border-top-width:5px; }
.box.wrong { outline:3px solid var(--bad); outline-offset:1px; }
.box.split { border-style:dashed; }
.box.dim { opacity:.18; }
.box.sel { outline:3px solid var(--accent); outline-offset:2px; z-index:2; }
.box .tag { position:absolute; left:0; top:-13px; font:600 9px var(--body); background:currentColor; padding:0 3px; border-radius:2px; white-space:nowrap; pointer-events:none; }
.box .tag span { color:#fff; }
.right { display:flex; flex-direction:column; min-height:0; }
.bar { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--surface); }
.key { padding:6px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12.5px; display:flex; flex-wrap:wrap; gap:4px 14px; background:var(--surface); }
.key i { display:inline-block; width:14px; height:10px; vertical-align:-1px; margin-right:5px; border:2px solid var(--muted); border-radius:2px; }
.rows { flex:1; overflow:auto; padding:6px 8px 40px; }
.row { padding:4px 8px; border-radius:4px; cursor:pointer; border-left:4px solid transparent; display:flex; flex-direction:column; gap:2px; }
.row.start { margin-top:9px; border-top:1px solid var(--line); padding-top:6px; }
.row.sel { background:color-mix(in srgb, var(--accent) 14%, transparent); }
.row .top { display:grid; grid-template-columns:118px minmax(0,1fr); gap:8px; align-items:baseline; }
.row .chip { font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .txt { font:500 16px/1.7 var(--arabic); direction:rtl; text-align:right; unicode-bidi:plaintext; overflow-wrap:anywhere; }
.says { display:flex; flex-wrap:wrap; gap:4px 6px; padding-left:126px; font-size:11.5px; }
.says span { border:1px solid var(--line); border-radius:999px; padding:0 8px; white-space:nowrap; }
.says .no { border-color:var(--bad); color:var(--bad); } .says .yes { color:var(--good); border-color:var(--good); }
@media (max-width: 900px) { main { grid-template-columns:1fr; } .left { border-right:0; max-height:55vh; } .says { padding-left:0; } }
</style>
</head>
<body>
<header>
  <h1>What each labeller said, line by line</h1>
  <span class="meta" id="where"></span>
  <span class="grow"></span>
  <span class="meta score" id="score"></span>
  <button id="prev">Previous page</button>
  <button id="next">Next page</button>
</header>
<main>
  <div class="left"><div class="sheet" id="sheet"></div></div>
  <div class="right">
    <div class="bar" id="filters" role="group" aria-label="Which lines to mark"></div>
    <div class="bar">
      <label class="meta" for="kind">Kind of page</label>
      <select id="kind"></select>
      <button id="jump">Next page with marked lines</button>
    </div>
    <div class="key">
      <span>Colour is the type at least two of the three judges chose; a thick top edge is where a block begins (Opus).</span>
      <span><i style="border-style:dashed"></i>the judges split</span>
      <span><i style="border-color:var(--bad)"></i>marked by the filter</span>
    </div>
    <div class="rows" id="rows"></div>
  </div>
</main>
<script src="judged_data.js"></script>
<script>
const T = Object.fromEntries(J.types.map(t => [t.id, t]));
const NAME = Object.fromEntries(J.who);
const tn = id => id && T[id] ? T[id].name : (id || "none");
const FILTERS = [
  ["Our retrained model is wrong", l => l.label && l.new !== l.label],
  ["Our earlier model is wrong", l => l.label && l.old !== l.label],
  ["Haiku differs from the judges", l => l.label && l.says.haikuhigh !== l.label],
  ["The judges split", l => l.split],
  ["Nothing marked", l => false],
];
let pi = 0, fi = 0, sel = -1, kind = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const pages = () => J.pages.filter(p => !kind || p.kind === kind);
function render() {
  const ps = pages(); pi = Math.max(0, Math.min(ps.length - 1, pi)); const p = ps[pi], f = FILTERS[fi][1];
  const judged = p.lines.filter(l => l.label);
  const pct = k => (100 * judged.filter(l => (k === "haiku" ? l.says.haikuhigh : l[k]) === l.label).length / Math.max(judged.length, 1)).toFixed(0);
  $("where").textContent = `Page ${pi + 1} of ${ps.length} · ${p.kind} · ${p.id}`;
  $("score").innerHTML = `on this page: earlier model <b>${pct("old")}%</b> · retrained <b>${pct("new")}%</b> · Haiku <b>${pct("haiku")}%</b>`;
  const any = p.lines.some(f);
  $("sheet").innerHTML = `<img alt="Scan of the page" src="${p.img}">` + p.lines.map((l, i) => {
    const t = T[l.label] || T.other;
    return `<div class="box ${l.start ? "start" : ""} ${l.split ? "split" : ""} ${f(l) ? "wrong" : any ? "dim" : ""} ${i === sel ? "sel" : ""}" data-i="${i}" title="${esc(tn(l.label))}"
      style="color:${t.color};left:${100 * l.b[0]}%;top:${100 * l.b[1]}%;width:${100 * (l.b[2] - l.b[0])}%;height:${100 * (l.b[3] - l.b[1])}%">${l.start ? `<span class="tag"><span>${esc(tn(l.label))}</span></span>` : ""}</div>`;
  }).join("");
  $("rows").innerHTML = p.lines.map((l, i) => {
    const t = T[l.label] || T.other, show = f(l) || l.split || i === sel;
    const says = !show ? "" : `<div class="says">` +
      [["new", "Our retrained model"], ["old", "Our earlier model"]].map(([k, n]) => `<span class="${l[k] === l.label ? "yes" : "no"}">${n}: ${esc(tn(l[k]))}</span>`).join("") +
      Object.entries(l.says).map(([w, v]) => `<span class="${v === l.label ? "" : "no"}">${esc(NAME[w])}: ${esc(tn(v))}</span>`).join("") + `</div>`;
    return `<div class="row ${l.start ? "start" : ""} ${i === sel ? "sel" : ""}" data-i="${i}" style="border-left-color:${f(l) ? "var(--bad)" : t.color}">
      <div class="top"><span class="chip" style="color:${t.color}">${l.start || show ? esc(tn(l.label)) : ""}</span><span class="txt">${esc(l.t)}</span></div>${says}</div>`;
  }).join("");
}
function pick(i) { sel = i === sel ? -1 : i; render(); const a = document.querySelector(`.row[data-i="${i}"]`), b = document.querySelector(`.box[data-i="${i}"]`); if (a) a.scrollIntoView({ block: "nearest" }); if (b) b.scrollIntoView({ block: "nearest" }); }
function go(d) { pi += d; sel = -1; render(); document.querySelector(".left").scrollTop = 0; $("rows").scrollTop = 0; }
$("filters").innerHTML = FILTERS.map(([n], i) => `<button aria-pressed="${i === fi}" data-i="${i}">${n}</button>`).join("");
$("filters").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; fi = +b.dataset.i; [...$("filters").children].forEach((c, i) => c.setAttribute("aria-pressed", i === fi)); render(); });
$("kind").innerHTML = `<option value="">All 14 kinds</option>` + [...new Set(J.pages.map(p => p.kind))].sort().map(k => `<option>${esc(k)}</option>`).join("");
$("kind").onchange = e => { kind = e.target.value; pi = 0; sel = -1; render(); };
$("jump").onclick = () => { const ps = pages(), f = FILTERS[fi][1]; for (let k = 1; k <= ps.length; k++) { const j = (pi + k) % ps.length; if (ps[j].lines.some(f)) { pi = j; sel = -1; render(); document.querySelector(".left").scrollTop = 0; return; } } };
for (const id of ["sheet", "rows"]) $(id).addEventListener("click", e => { const el = e.target.closest("[data-i]"); if (el) pick(+el.dataset.i); });
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
document.addEventListener("keydown", e => { if (e.target.closest("select")) return; if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1); });
render();
</script>
</body>
</html>
